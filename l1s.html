<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>第一届传奇杯 开赛海报</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body
    class="min-h-screen flex items-center justify-center p-6 text-slate-100 bg-[radial-gradient(circle_at_top,#581c87_0,#020617_55%,#020617_100%)]"
  >
    <div
      class="relative w-full max-w-5xl overflow-hidden rounded-3xl bg-slate-900/60 border border-slate-700 shadow-2xl shadow-black/60 p-6 sm:p-10"
    >
      <div
        class="pointer-events-none absolute -inset-[35%] opacity-80 blur-0 bg-[radial-gradient(circle_at_15%_0%,rgba(167,139,250,0.2),transparent_60%),radial-gradient(circle_at_85%_100%,rgba(251,191,36,0.22),transparent_60%)]"
      ></div>

      <div class="relative z-10 flex flex-col md:flex-row md:items-center md:justify-between gap-6">
        <div class="flex-1">
          <div
            class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-[12px] tracking-[0.18em] uppercase bg-slate-950/40 border border-violet-400/60 text-violet-200 backdrop-blur"
          >
            <span class="text-base">🏆</span>
            <span>第一届 传奇杯</span>
          </div>

          <h1 class="mt-3 text-3xl sm:text-4xl font-extrabold leading-tight tracking-[0.18em] uppercase">
            <span class="bg-gradient-to-r from-violet-400 to-amber-400 bg-clip-text text-transparent">开赛预告</span><br />
            Match Day is Coming
          </h1>

          <div class="mt-2 text-sm text-slate-300/90">
            即将开打！桂花树下的小雨滴 vs 西浦军校
          </div>
        </div>
      </div>

      <div class="relative z-10 mt-6 grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div class="flex items-center gap-3 p-4 rounded-2xl bg-slate-950/40 border border-slate-800 backdrop-blur">
          <div class="w-9 h-9 rounded-full grid place-items-center text-lg bg-violet-400/10 ring-1 ring-violet-400/40">📅</div>
          <div>
            <div class="text-[11px] text-slate-400 tracking-[0.14em] uppercase">开赛时间</div>
            <div class="text-sm text-slate-100">3月6日（周五） · 21:00</div>
          </div>
        </div>

        <div class="flex items-center gap-3 p-4 rounded-2xl bg-slate-950/40 border border-slate-800 backdrop-blur">
          <div class="w-9 h-9 rounded-full grid place-items-center text-lg bg-violet-400/10 ring-1 ring-violet-400/40">⚔️</div>
          <div class="min-w-0">
            <div class="text-[11px] text-slate-400 tracking-[0.14em] uppercase">赛制信息</div>
            <div class="text-sm text-violet-200 break-all">BO3</div>
          </div>
        </div>
      </div>

      <div class="relative z-10 my-6 h-px opacity-90 bg-gradient-to-r from-transparent via-slate-500/80 to-transparent"></div>

      <div class="relative z-10 grid grid-cols-1 md:grid-cols-[1fr_auto_1fr] gap-5 items-stretch">
        <div
          class="rounded-2xl p-5 bg-gradient-to-br from-slate-950/50 to-violet-900/10 border border-violet-400/40 shadow-xl shadow-violet-500/10 backdrop-blur"
        >
          <div class="flex items-start justify-between gap-3">
            <div class="text-lg font-bold tracking-[0.12em] text-slate-100">桂花树下的小雨滴</div>
            <div
              class="text-[11px] px-2 py-1 rounded-full uppercase tracking-[0.12em] bg-slate-950/40 text-violet-200 border border-violet-400/60"
            >
              🏳️
            </div>
          </div>

          <ul class="mt-4 space-y-2">
            <li class="flex gap-2 py-1 border-b border-dashed border-slate-700/70">
              <span class="w-2 h-2 mt-1.5 rounded-full bg-amber-400 shadow shadow-amber-500/30"></span>
              <span class="text-sm break-words">Stupid</span>
            </li>
            <li class="flex gap-2 py-1 border-b border-dashed border-slate-700/70">
              <span class="w-2 h-2 mt-1.5 rounded-full bg-amber-400 shadow shadow-amber-500/30"></span>
              <span class="text-sm break-words">无敌破坏龟</span>
            </li>
            <li class="flex gap-2 py-1 border-b border-dashed border-slate-700/70">
              <span class="w-2 h-2 mt-1.5 rounded-full bg-amber-400 shadow shadow-amber-500/30"></span>
              <span class="text-sm break-words">牛小伟</span>
            </li>
            <li class="flex gap-2 py-1 border-b border-dashed border-slate-700/70">
              <span class="w-2 h-2 mt-1.5 rounded-full bg-amber-400 shadow shadow-amber-500/30"></span>
              <span class="text-sm break-words">无欲拔刀神</span>
            </li>
            <li class="flex gap-2 py-1 border-b border-dashed border-slate-700/70">
              <span class="w-2 h-2 mt-1.5 rounded-full bg-amber-400 shadow shadow-amber-500/30"></span>
              <span class="text-sm break-words">陈小树</span>
            </li>
            <li class="flex gap-2 py-1 border-b border-dashed border-slate-700/70">
              <span class="w-2 h-2 mt-1.5 rounded-full bg-amber-400 shadow shadow-amber-500/30"></span>
              <span class="text-sm break-words">iRain</span>
            </li>
            <li class="flex gap-2 py-1">
              <span class="w-2 h-2 mt-1.5 rounded-full bg-amber-400 shadow shadow-amber-500/30"></span>
              <span class="text-sm break-words">还是差点的帕琪</span>
            </li>
          </ul>
        </div>

        <div class="flex items-center justify-center">
          <div
            class="relative w-20 h-20 rounded-full grid place-items-center bg-[radial-gradient(circle_at_30%_0%,#fef3c7,#f59e0b)] text-slate-900 font-extrabold text-2xl tracking-[0.18em] shadow-lg shadow-amber-500/30 ring-4 ring-slate-950/60"
          >
            VS
          </div>
        </div>

        <div
          class="rounded-2xl p-5 bg-gradient-to-br from-slate-950/50 to-violet-900/10 border border-violet-400/40 shadow-xl shadow-violet-500/10 backdrop-blur"
        >
          <div class="flex items-start justify-between gap-3">
            <div class="text-lg font-bold tracking-[0.12em] text-slate-100">西浦军校</div>
            <div
              class="text-[11px] px-2 py-1 rounded-full uppercase tracking-[0.12em] bg-slate-950/40 text-amber-200 border border-amber-400/60"
            >
              辅助有什么用
            </div>
          </div>

          <ul class="mt-4 space-y-2">
            <li class="flex gap-2 py-1 border-b border-dashed border-slate-700/70">
              <span class="w-2 h-2 mt-1.5 rounded-full bg-amber-400 shadow shadow-amber-500/30"></span>
              <span class="text-sm break-words">了小土</span>
            </li>
            <li class="flex gap-2 py-1 border-b border-dashed border-slate-700/70">
              <span class="w-2 h-2 mt-1.5 rounded-full bg-amber-400 shadow shadow-amber-500/30"></span>
              <span class="text-sm break-words">元始天王</span>
            </li>
            <li class="flex gap-2 py-1 border-b border-dashed border-slate-700/70">
              <span class="w-2 h-2 mt-1.5 rounded-full bg-amber-400 shadow shadow-amber-500/30"></span>
              <span class="text-sm break-words">狄拉克态空间坐标表象</span>
            </li>
            <li class="flex gap-2 py-1 border-b border-dashed border-slate-700/70">
              <span class="w-2 h-2 mt-1.5 rounded-full bg-amber-400 shadow shadow-amber-500/30"></span>
              <span class="text-sm break-words">西普军校政治部主任</span>
            </li>
            <li class="flex gap-2 py-1 border-b border-dashed border-slate-700/70">
              <span class="w-2 h-2 mt-1.5 rounded-full bg-amber-400 shadow shadow-amber-500/30"></span>
              <span class="text-sm break-words">macsed</span>
            </li>
            <li class="flex gap-2 py-1">
              <span class="w-2 h-2 mt-1.5 rounded-full bg-amber-400 shadow shadow-amber-500/30"></span>
              <span class="text-sm break-words">小肥星</span>
            </li>
          </ul>
        </div>
      </div>

      <div class="relative z-10 mt-6 pt-5 text-center text-sm text-slate-200">
        <div
          class="absolute top-0 left-1/2 -translate-x-1/2 w-44 h-px bg-gradient-to-r from-transparent via-slate-500/80 to-transparent opacity-90"
        ></div>

        <div>
          <strong class="text-amber-200">赛场见真章</strong>
        </div>
          <p class="mt-2 text-base text-slate-300/90">🔥 第一届 · 传奇杯 🔥</p>
      </div>
    </div>
  </body>
</html>
